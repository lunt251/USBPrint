name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_apk:
        description: Build the unsigned release APK
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build CAPT reference vectors (captdriver C compressor)
        run: |
          gcc -O2 -Itools/capt-ref -o /tmp/hiscoa-golden \
            tools/capt-ref/golden.c tools/capt-ref/hiscoa-compress.c tools/capt-ref/hiscoa-common.c
          /tmp/hiscoa-golden tools/capt-ref/hiscoa_cases.bin
          ls -l tools/capt-ref/hiscoa_cases.bin

      - name: Build, test, lint
        run: gradle assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USBPrint-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build and lint unsigned release APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_apk
        run: gradle assembleRelease lintRelease --stacktrace

      - name: Upload unsigned release APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_apk
        uses: actions/upload-artifact@v4
        with:
          name: USBPrint-unsigned-release-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
          if-no-files-found: ignore
