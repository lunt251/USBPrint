name: Build

on:
  push:
    branches: [fdroid]
    tags: ["fdroid-v*"]
  pull_request:
    branches: [fdroid]
  workflow_dispatch:
    inputs:
      listing_screenshots:
        description: Capture listing screenshots with a blank emulator and demo document
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build CAPT reference vectors (captdriver C compressor)
        run: |
          gcc -O2 -Itools/capt-ref -o /tmp/hiscoa-golden \
            tools/capt-ref/golden.c tools/capt-ref/hiscoa-compress.c tools/capt-ref/hiscoa-common.c
          /tmp/hiscoa-golden tools/capt-ref/hiscoa_cases.bin
          ls -l tools/capt-ref/hiscoa_cases.bin

      - name: Build, test, lint
        run: gradle assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Build and lint unsigned release APK
        run: gradle assembleRelease lintRelease --stacktrace

      - name: Verify the APK does not contain manufacturer logos
        run: |
          tools=("$ANDROID_HOME"/build-tools/*/aapt2)
          "${tools[-1]}" dump resources app/build/outputs/apk/release/app-release-unsigned.apk > "$RUNNER_TEMP/fdroid-resources.txt"
          if grep -F 'drawable/brand_' "$RUNNER_TEMP/fdroid-resources.txt"; then
            echo 'Manufacturer logos must not ship in the F-Droid APK' >&2
            exit 1
          fi

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: USBPrint-fdroid-unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error

      - name: Capture screenshots from the demo emulator
        if: inputs.listing_screenshots
        run: bash .github/scripts/listing-screenshots.sh app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/listing"

      - name: Upload listing screenshots
        if: inputs.listing_screenshots
        uses: actions/upload-artifact@v4
        with:
          name: USBPrint-listing-screenshots
          path: ${{ runner.temp }}/listing/*.png
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
          if-no-files-found: ignore
